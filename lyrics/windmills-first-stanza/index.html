<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Windmills of Your Mind, first stanza</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #10131d;
    color: #dfe5f2;
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }
  .meta {
    color: #93a0b8;
    font-size: 0.95rem;
    margin-bottom: 40px;
  }
  .stanza {
    display: grid;
    gap: 42px;
  }
  figure {
    margin: 0;
  }
  .lyric {
    font-size: clamp(1.25rem, 3vw, 1.8rem);
    font-style: italic;
    margin: 0 0 14px;
  }
  img {
    display: block;
    width: 100%;
    max-width: 760px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 18px;
    background: #1a2030;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>
<main>
  <h1>The Windmills of Your Mind, first stanza</h1>
  <p class="meta">Song key: windmills-first-stanza · Image model: flux · Generated locally with Pollinations.AI</p>
  <section class="stanza">
  <figure>
    <p class="lyric">Round like a circle in a spiral, like a wheel within a wheel</p>
    <img src="images/windmills-first-stanza-001.jpg" alt="Dreamlike illustration for line 1" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">Never ending or beginning on an ever spinning reel</p>
    <img src="images/windmills-first-stanza-002.jpg" alt="Dreamlike illustration for line 2" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">Like a snowball down a mountain, or a carnival balloon</p>
    <img src="images/windmills-first-stanza-003.jpg" alt="Dreamlike illustration for line 3" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">Like a carousel that&#x27;s turning, running rings around the moon</p>
    <img src="images/windmills-first-stanza-004.jpg" alt="Dreamlike illustration for line 4" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">Like a clock whose hands are sweeping past the minutes of its face</p>
    <img src="images/windmills-first-stanza-005.jpg" alt="Dreamlike illustration for line 5" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">And the world is like an apple whirling silently in space</p>
    <img src="images/windmills-first-stanza-006.jpg" alt="Dreamlike illustration for line 6" loading="lazy">
  </figure>
  <figure>
    <p class="lyric">Like the circles that you find in the windmills of your mind</p>
    <img src="images/windmills-first-stanza-007.jpg" alt="Dreamlike illustration for line 7" loading="lazy">
  </figure>
</section>
</main>
</body>
</html>
