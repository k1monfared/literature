<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://k1monfared.github.io/site_kit/css/base.css">
  <link rel="stylesheet" href="https://k1monfared.github.io/site_kit/css/nav.css">
  <link rel="stylesheet" href="{{style_url}}">
  <script src="https://k1monfared.github.io/site_kit/js/theme.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-left">
        <a class="site-title" href="{{home_url}}">{{site_title}}</a>
        {{crumb}}
      </div>
      <div class="playerbar" id="playerbar" dir="ltr" hidden>
        <button id="pb-toggle" class="pb-btn" aria-label="Play">&#9654;</button>
        <span class="pb-title" id="pb-title"></span>
        <div class="pb-progress" id="pb-progress" role="slider" aria-label="Seek">
          <span class="pb-fill" id="pb-fill"></span>
        </div>
        <span class="pb-time" id="pb-time">0:00 / 0:00</span>
        <a id="pb-close" class="pb-close" href="#" aria-label="Close player">&#215;</a>
      </div>
      <nav>
        <a class="lang-switch" href="{{lang_switch_url}}" title="{{lang_switch_title}}">{{lang_switch_label}}</a>
        <button id="theme-toggle" aria-label="Toggle theme"></button>
      </nav>
    </div>
    <audio id="player-audio" preload="metadata"></audio>
  </header>
  <main class="container">
    {{content}}
  </main>
  <footer>
    <div class="container">{{footer}}</div>
  </footer>
  <script src="{{script_url}}" defer></script>
  <script src="{{footnotes_script_url}}" defer></script>
</body>
</html>
